name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      
      # This step builds the app while passing in your secrets
      - name: Build with Secrets
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://supabase.com/dashboard/project/ondwhdenvnxvmuyghzcl
          VITE_SUPABASE_ANON_KEY: sb_publishable_o5mLOV40hE_ZHDPVORekBw_NicH4Xlb
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
